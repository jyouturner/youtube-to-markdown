# LiteLLM proxy — throwaway spike config (Layer-2 gateway validation).
#
# Purpose: prove a real-time hard-budget cutoff that rejects a request at the
# gateway BEFORE forwarding to Anthropic — the one thing the app-side gate and
# the Anthropic Admin API cannot do.
#
# No secret in this file: the real Anthropic key is read from the environment
# (os.environ/ANTHROPIC_API_KEY) — point it at the yt2md-workspace key so any
# spend lands in the gated $20 workspace.
#
# Run:
#   set -a; . ~/yt2md/.env; set +a            # export ANTHROPIC_API_KEY
#   uv run --with 'litellm[proxy]' litellm --config docs/spikes/litellm/config.yaml --port 4000

model_list:
  - model_name: claude-haiku                       # the name clients call
    litellm_params:
      model: anthropic/claude-haiku-4-5            # OpenAI-shaped -> Anthropic backend
      api_key: os.environ/ANTHROPIC_API_KEY
      # Explicit Haiku 4.5 pricing ($1/M in, $5/M out) so the proxy's spend
      # tracking is deterministic regardless of LiteLLM's built-in price map.
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005

# SPIKE FINDING: a global `litellm_settings.max_budget` WITHOUT a database is a
# silent no-op — the proxy forwards every call and enforces nothing (a false
# kill switch). LiteLLM's budget enforcement lives in its spend/key store, which
# is Prisma + Postgres-only (no SQLite). So real budgets require a DB. We set one
# up ephemerally and put the budget on a per-VIRTUAL-KEY basis (the real
# Layer-2 feature), created at runtime via POST /key/generate {max_budget: ...}.

general_settings:
  master_key: sk-spike-master                      # proxy admin/auth key (local only)
  database_url: os.environ/DATABASE_URL            # ephemeral throwaway Postgres
